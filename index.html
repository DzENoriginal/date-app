<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приглашение 💖</title>
    <style>
        /* Общий фон */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #fce4ec, #f8bbd0);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
            overflow: hidden;
            position: relative;
        }

        /* Контейнер-открытка */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(6px);
            padding: 40px 30px;
            border-radius: 60px 20px 60px 20px;
            box-shadow: 0 20px 60px rgba(233, 30, 99, 0.3);
            text-align: center;
            max-width: 380px;
            width: 90%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            transition: 0.3s;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #880e4f;
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .sub-text {
            color: #ad1457;
            font-size: 16px;
            margin-bottom: 30px;
            opacity: 0.8;
            font-style: italic;
        }

        .emoji-big {
            font-size: 72px;
            line-height: 1;
            display: block;
            margin-bottom: 15px;
        }

        /* Блок с кнопками */
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 15px;
            position: relative;
            min-height: 80px;
        }

        /* Кнопка ДА */
        .btn-yes {
            background: #d81b60;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 6px 0 #880e4f;
            transition: all 0.1s ease;
            z-index: 10;
            letter-spacing: 2px;
            min-width: 100px;
        }

        .btn-yes:active {
            transform: scale(0.95);
            box-shadow: 0 2px 0 #880e4f;
        }

        /* Кнопка НЕТ — будет "убегать" */
        .btn-no {
            background: #78909c;
            color: white;
            border: none;
            padding: 16px 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 6px 0 #37474f;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            position: relative;
            z-index: 10;
            min-width: 100px;
            letter-spacing: 2px;
        }

        /* Анимация для сердечек */
        .heart {
            position: fixed;
            font-size: 40px;
            pointer-events: none;
            animation: floatUp 2s ease-out forwards;
            z-index: 999;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.3) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-500px) scale(1.8) rotate(50deg);
            }
        }

        /* Сообщение после согласия — всегда скрыто, пока не нажмут */
        .hidden-message {
            display: none;
            margin-top: 20px;
            font-size: 20px;
            color: #880e4f;
            background: #fff0f3;
            padding: 20px;
            border-radius: 30px;
            border: 2px dashed #d81b60;
            animation: pop 0.5s ease;
        }

        .hidden-message.show {
            display: block;
        }

        .hidden-message a {
            color: #d81b60;
            font-weight: bold;
            text-decoration: none;
            border-bottom: 2px solid #d81b60;
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Адаптив для маленьких экранов */
        @media (max-width: 480px) {
            .card { padding: 25px 20px; }
            .btn-yes, .btn-no { padding: 14px 20px; font-size: 18px; min-width: 80px; }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

<div class="card" id="card">
    <span class="emoji-big">🌸</span>
    <h1>Привет, красотка!</h1>
    <p class="sub-text">У меня к тебе один вопрос... 👇</p>

    <div style="font-size: 28px; font-weight: 600; color: #4a148c; margin: 10px 0 20px;">
        Ты пойдешь со мной <br>на свидание?
    </div>

    <div class="buttons" id="buttonContainer">
        <button class="btn-yes" id="yesBtn">ДА 💖</button>
        <button class="btn-no" id="noBtn">НЕТ 😤</button>
    </div>

    <!-- Скрытый блок, который появится после ДА -->
    <div class="hidden-message" id="successMessage">
        😊 <strong>Я знал!</strong> 😄<br><br>
        Ты - лучшая! ❤️<br>
        <span style="font-size: 18px;">Тогда я приеду за тобой <br> <strong>в среду в 18:00</strong> 😉</span><br><br>
        📍 <a href="https://yandex.ru/maps/-/CTdZ7OLH" target="_blank">Узнать куда поедем</a>
    </div>  
</div>

<script>
    (function() {
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const successMsg = document.getElementById('successMessage');
        const container = document.getElementById('buttonContainer');

        // Флаг: показывали ли уже сообщение
        let isMessageShown = false;

        // --- 1. Функция для "убегания" кнопки "НЕТ" по ВСЕМУ ЭКРАНУ ---
        function moveNoButton(e) {
            if (e) e.preventDefault();

            // Если кнопка скрыта — не двигаем
            if (noBtn.style.display === 'none') return;

            // Размеры кнопки
            const btnW = noBtn.offsetWidth || 110;
            const btnH = noBtn.offsetHeight || 60;

            const padding = 15;
            const maxX = window.innerWidth - btnW - padding;
            const maxY = window.innerHeight - btnH - padding;

            // Случайные координаты
            let randomX = Math.random() * maxX;
            let randomY = Math.random() * maxY;

            randomX = Math.min(Math.max(randomX, padding), maxX);
            randomY = Math.min(Math.max(randomY, padding), maxY);

            // Перемещаем кнопку в body с fixed-позиционированием
            if (!noBtn.classList.contains('flying')) {
                noBtn.classList.add('flying');
                noBtn.style.position = 'fixed';
                noBtn.style.zIndex = '1000';
                noBtn.style.animation = 'none';
                noBtn.style.opacity = '1';
                document.body.appendChild(noBtn);
            }

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            // Эффект "испуга"
            const rotation = (Math.random() - 0.5) * 20;
            noBtn.style.transform = `scale(0.85) rotate(${rotation}deg)`;
            noBtn.style.transition = 'left 0.15s ease-out, top 0.15s ease-out, transform 0.15s ease-out';

            setTimeout(() => {
                if (noBtn.style.display !== 'none') {
                    noBtn.style.transform = 'scale(1) rotate(0deg)';
                }
            }, 200);
        }

        // --- 2. Обработчики для кнопки "НЕТ" ---
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            moveNoButton(e);
        });
        noBtn.addEventListener('click', function(e) {
            e.preventDefault();
            moveNoButton(e);
        });

        // --- 3. Функция создания сердечка ---
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');

            const emojis = ['❤️', '💖', '💗', '💕', '♥️', '✨', '🌸', '🌺', '💝', '💘', '🌹', '🥰', '😍'];
            heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];

            heart.style.left = (Math.random() * 90 + 5) + '%';
            heart.style.top = (Math.random() * 40 + 50) + '%';
            heart.style.fontSize = (Math.random() * 35 + 25) + 'px';
            heart.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';

            document.body.appendChild(heart);

            setTimeout(() => {
                if (heart.parentNode) {
                    heart.remove();
                }
            }, 3500);
        }

        function launchHearts(count, delay) {
            for (let i = 0; i < count; i++) {
                setTimeout(createHeart, i * delay);
            }
        }

        // --- 4. Кнопка "ДА" — показывает сообщение ОДИН РАЗ и запускает сердечки ---
        yesBtn.addEventListener('click', function(e) {
            e.preventDefault();

            // Если сообщение ещё не показано — показываем
            if (!isMessageShown) {
                successMsg.style.display = 'block';
                successMsg.classList.add('show');
                isMessageShown = true;

                // Меняем кнопку
                yesBtn.textContent = '😊 Я счастлив! 😄';
                yesBtn.style.opacity = '0.7';
                
                // Прячем кнопку "НЕТ"
                noBtn.style.display = 'none';

                // Прокручиваем к сообщению
                setTimeout(() => {
                    successMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 400);
            }

            // Запускаем сердечки ПРИ КАЖДОМ нажатии (и после первого, и после повторных)
            launchHearts(40, 50);
            setTimeout(() => launchHearts(30, 40), 1000);
            setTimeout(() => launchHearts(20, 35), 2000);
        });

        // --- 5. Защита от вылета кнопки за пределы ---
        window.addEventListener('resize', function() {
            if (noBtn.classList.contains('flying') && noBtn.style.display !== 'none') {
                const btnW = noBtn.offsetWidth || 110;
                const btnH = noBtn.offsetHeight || 60;
                const padding = 15;

                let left = parseFloat(noBtn.style.left) || 0;
                let top = parseFloat(noBtn.style.top) || 0;

                const maxX = window.innerWidth - btnW - padding;
                const maxY = window.innerHeight - btnH - padding;

                if (left > maxX) left = maxX;
                if (top > maxY) top = maxY;
                if (left < padding) left = padding;
                if (top < padding) top = padding;

                noBtn.style.left = left + 'px';
                noBtn.style.top = top + 'px';
            }
        });

        console.log('✅ Приложение загружено! Нажимай на "ДА" — будут сердечки!');

    })();
</script>
</body>
</html>
